services:
  payload:
    image: node:24.21.0-alpine
    ports:
      - '3000:3000'
    volumes:
      - ../..:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: imresamu/postgis:17-3.5
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: community
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-local-databases.sql:/docker-entrypoint-initdb.d/10-init-local-databases.sql:ro

volumes:
  pgdata:
  node_modules:
