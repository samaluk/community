# React Doctor — lightweight, independent React/Next.js quality gate.
#
# Scans ONLY the React/Next.js app (`apps/web`) and blocks merges on any NEW
# React Doctor error OR warning a pull request introduces relative to its merge
# base. Existing repository debt is reported but never fails the check, so
# adoption is strict on regressions without turning today's backlog into an
# immediate blocker.
# Dependency-only pull requests intentionally use this changed-scope gate; a
# React Doctor version bump with no app-file changes may therefore scan zero
# files. Whole-project audits remain an explicit local/manual operation rather
# than a separate default-branch workflow.
#
# The Action installs its own Node runtime and react-doctor CLI and caches them
# internally, so this workflow deliberately needs NO dependency install, build,
# database, migrations, or test setup — it is a separate gate from CI (ci.yml)
# and does not duplicate Fallow or the other quality jobs.
name: React Doctor

on:
  # Baseline scan of the PR's changed files: posts a sticky summary comment,
  # inline review comments, and a commit status, and fails on new findings.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least-privilege at the workflow scope; the elevated write permissions the
    # Action needs for PR feedback are scoped to this job only.
    permissions:
      contents: read
      pull-requests: write # inline review comments
      issues: write        # sticky PR summary comment
      statuses: write      # commit status (score + error/warning counts)

    steps:
      # Full history so the Action can resolve the merge base for the baseline
      # (`changed`) diff scope and derive the PR's changed files locally.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolve the react-doctor version the workspace pins so the scan below
      # runs the exact CLI the local hk gates run — not the Action default
      # (react-doctor@latest). Read from pnpm-lock.yaml: there is no dependency
      # install in this workflow, so node_modules resolution would always fail
      # on runners, and package.json may hold a Renovate range — the lockfile
      # carries the exact resolved version instead. (The [[:space:]] anchor
      # matches this repo's pnpm-lock v9 keys, which have no leading slash,
      # and keeps sibling packages like oxlint-plugin-react-doctor from
      # matching.)
      - id: rdver
        run: |
          v="$(grep -m1 -oE '[[:space:]]react-doctor@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | cut -d@ -f2-)"
          if [ -z "$v" ]; then echo "::error::react-doctor version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Immutable SHA pin to the current v2 release (millionco/react-doctor v2.2.8);
      # Renovate keeps the digest current via helpers:pinGitHubActionDigests.
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          # Scan only the React/Next.js app — isolates this gate from the rest
          # of the monorepo and avoids workspace-boundary confusion.
          directory: apps/web
          # Deterministic CLI: the workspace-pinned react-doctor version
          # (resolved by the rdver step above), matching local hook scans.
          # Without this, the Action would install react-doctor@latest.
          version: ${{ steps.rdver.outputs.version }}
          # Baseline gate: report only the issues the PR introduces vs its merge
          # base. Existing debt is surfaced but never fails the check.
          scope: changed
          # Fail the workflow on ANY new finding (error OR warning) introduced
          # by the PR.
          blocking: warning
          # PR feedback surfaces (all on by default; made explicit for intent).
          comment: true          # sticky summary comment (needs issues: write)
          review-comments: true  # inline review comments (needs pull-requests: write)
          commit-status: true    # score + counts on the commit (needs statuses: write)
