name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions

jobs:
  # Static quality checks and the integration/E2E suite run as parallel jobs so
  # a pull request goes green as fast as possible. Each job is its own required
  # status check (the master-branch ruleset lists these exact names), so every
  # one must pass for a merge. Coverage and Fallow jobs live in fallow.yml.
  static:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Lint
        run: pnpm run check:lint

      - name: Format check
        run: pnpm format:check

      # `tsc --noEmit` compiles against Next.js's generated route types in
      # `.next/types`. Discard any stale generated types so typecheck always
      # runs against real source, not leftover build artefacts.
      - name: Clean stale generated types
        run: rm -rf apps/web/.next/types apps/web/.next/dev
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

  build-and-integration:
    name: Build, integration, and E2E tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5433/community
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5433/community_test
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Allocate app port
        shell: bash
        run: |
          APP_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')"
          {
            echo "APP_PORT=$APP_PORT"
            echo "PORT=$APP_PORT"
            echo "NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:$APP_PORT"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          docker rm -f postgres 2>/dev/null || true
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=community \
            -p 5433:5432 \
            imresamu/postgis:17-3.5

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d community >/dev/null 2>&1 || { sleep 1; continue; }
            # pg_isready succeeds against the entrypoint's temporary postmaster
            # (used for first-boot initdb.d setup); only proceed once init is
            # truly complete or CREATE DATABASE gets killed by its fast shutdown.
            docker logs postgres 2>&1 | grep -q "PostgreSQL init process complete; ready for start up" && break
            sleep 1
          done

      - name: Create integration test database
        run: docker exec postgres psql -U postgres -d community -c "CREATE DATABASE community_test;"

      - name: Migrate and seed E2E fixtures
        working-directory: apps/web
        run: pnpm migrate && pnpm exec tsx scripts/seed-e2e-fixtures.ts
        env:
          NODE_ENV: production

      - name: Build normal production target
        working-directory: apps/web
        run: pnpm build:next
        env:
          NODE_ENV: production

      - name: Integration tests
        run: pnpm test:int

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Build instant-navigation test target
        working-directory: apps/web
        run: pnpm build:next
        env:
          NODE_ENV: production
          # The instant project needs Next's testing API. Never enable this
          # flag in a deployment serving real users.
          EXPOSE_TESTING_API: 1

      - name: Instant-navigation E2E tests
        working-directory: apps/web
        run: pnpm test:e2e:instant
        env:
          EXPOSE_TESTING_API: 1
