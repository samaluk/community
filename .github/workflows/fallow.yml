# Full-repository gate and changed-code feedback share one coverage artifact.
# Job names match the master branch's required status checks.
name: Fallow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage-root: ${{ steps.coverage.outputs.root }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Test with coverage
        id: coverage
        run: |
          pnpm test:coverage
          echo "root=$PWD" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fallow
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Fallow gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-fallow
          path: coverage

      - name: Fallow CI gate
        # Fallow rebases the producing checkout's Istanbul paths natively.
        env:
          FALLOW_COVERAGE_ROOT: ${{ needs.test.outputs.coverage-root }}
        run: pnpm fallow:ci

  review:
    name: Fallow PR review
    # Independent of the full gate so findings still reach the PR when it fails.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-fallow
          path: coverage

      # The Action reads the pinned CLI version and provisions its semantic
      # companion. The full gate requires complete types; review is best-effort.
      - name: Fallow changed-code audit
        uses: fallow-rs/fallow@1f5a08d9addde37d81aefcf10407600307da393b # v3.35.0
        with:
          command: audit
          gate: new-only
          # Explicit true is required for the Action to forward the override.
          type-aware: true
          type-aware-require: best-effort
          coverage: coverage/coverage-final.json
          coverage-root: ${{ needs.test.outputs.coverage-root }}
          comment: true
          comment-layout: compact
          branded-token: false
          review-comments: true
          review-guidance: true
          sarif: false
