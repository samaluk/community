# Fallow — fully-blocking quality gate plus native PR feedback.
#
# The test job produces the one fresh coverage artifact. The gate then runs the
# FULL repository scan via `pnpm fallow:ci` (the canonical alias; dead-code,
# duplication, complexity/CRAP, fail-on-issues) over that artifact. There is no
# pre-existing backlog to grandfather (#264), so a single new finding fails.
#
# The review job is the PR feedback surface of the same analysis: sticky
# summary comment, Check Run, and inline review comments from the pinned
# Fallow Action, consuming the coverage artifact the test job produced.
#
# Job display names ("Fallow gate", "Fallow PR review") match the master-branch
# ruleset's required status checks exactly; they moved here from ci.yml.
name: Fallow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fallow
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Fallow gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      # Download the one coverage result produced by the test job. Istanbul
      # keys contain the producing checkout's absolute path, so re-anchor
      # before Fallow consumes it.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-fallow
          path: coverage

      - name: Re-anchor coverage paths to this checkout
        run: node scripts/reanchor-coverage.mjs coverage/coverage-final.json

      - name: Fallow CI gate
        run: pnpm fallow:ci

  review:
    name: Fallow PR review
    # Run even when the gate failed — that is exactly when the sticky
    # comment / Check Run / inline comments must render. The shared test job is
    # the evidence boundary: a failed test or artifact upload skips both
    # quality consumers, while a gate failure does not suppress review feedback.
    if: ${{ needs.test.result == 'success' && !cancelled() && github.event_name == 'pull_request' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Least-privilege at the workflow scope; the elevated write permissions the
    # Action needs for PR feedback are scoped to this job only.
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same coverage evidence the test job produced, so audit CRAP scoring
      # matches — downloaded rather than regenerated to avoid a second
      # install + test run. Istanbul keys embed the producing checkout's
      # absolute path, so re-anchor every key to this checkout before the
      # audit consumes it. node is pre-installed on ubuntu-latest.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-fallow
          path: coverage

      - name: Re-anchor coverage paths to this checkout
        run: node scripts/reanchor-coverage.mjs coverage/coverage-final.json

      # The Action self-installs the fallow CLI. The `version` input reads the
      # pinned version from the root package.json `fallow` dependency automatically
      # when omitted — no manual install step needed.
      #
      # This is the PR feedback surface (sticky comment + inline review comments).
      # The hard gate is the separate `gate` job that runs `pnpm fallow:ci`.
      # Use `gate: new-only` so pre-existing findings on incidentally-touched
      # files don't block the PR, and `type-aware-require: best-effort` so an
      # unavailable type-aware sidecar degrades gracefully instead of failing.
      - name: Fallow changed-code audit
        uses: fallow-rs/fallow@c2da9fcae5388226a87e986b1812f9c872d288c6 # v3.24.1
        with:
          command: audit
          gate: new-only
          type-aware: true
          type-aware-require: best-effort
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          branded-token: false
          review-comments: true
          review-guidance: true
          sarif: false
